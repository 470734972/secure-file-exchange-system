<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>受控文件交换平台</title><link rel="stylesheet" href="/style.css"></head><body><header><div><p class="eyebrow">SECURE FILE EXCHANGE · ROCKY EDITION</p><h1>受控文件交换平台</h1></div><div id="zoneBadge" class="zone"></div><button id="logout" hidden>退出</button></header><main><section class="notice"><b>安全说明：</b>8080/8081 是固定区域入口；必须使用防火墙或 VLAN 限制两个端口的访问源。</section><section id="login" class="panel"><h2>账号登录</h2><p class="muted">支持管理员创建的本地账户，以及已配置的 Microsoft AD/LDAPS 账户。</p><form id="loginForm"><label>用户名<input name="username" required></label><label>密码<input name="password" type="password" required></label><button>登录</button></form><p id="message"></p></section><div id="work" hidden><section class="flow"><span id="source"></span><i>提交</i><span>隔离交换区</span><i>审批</i><span id="target"></span></section><section class="grid"><article class="panel"><h2>创建文件交换申请</h2><p class="muted">支持 Office、PDF、图片、压缩包、安装包和 DWG；可执行文件与脚本仍禁止。</p><form id="uploadForm"><label>文件<input name="file" type="file" required accept=".txt,.md,.csv,.json,.xml,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.png,.jpg,.jpeg,.bmp,.tif,.tiff,.zip,.rar,.7z,.tar,.gz,.tgz,.bz2,.xz,.rpm,.deb,.dwg"></label><label>目标接收人（用户名）<input name="recipient" required></label><label>用途<input name="purpose" required></label><label>敏感等级<select name="sensitivity"><option>内部</option><option>受限</option><option>机密</option></select></label><button>提交检测</button></form><p id="uploadMessage"></p></article><article class="panel"><h2>当前身份</h2><div id="identity"></div><p class="muted">审批人不能审批自己提交的文件。</p></article></section><section class="panel wide"><h2>交换任务</h2><button class="ghost" id="refresh">刷新</button><div id="tasks" class="tasks"></div></section><section id="admin" class="panel wide" hidden><h2>创建本地用户</h2><form id="userForm"><label>用户名<input name="username" required></label><label>显示名称<input name="displayName"></label><label>初始密码<input name="password" type="password" minlength="8" required></label><label>角色<select name="role"><option value="user">普通用户</option><option value="approver">审批人</option><option value="admin">管理员</option></select></label><label>区域<span><input name="office" type="checkbox" checked>办公 <input name="rd" type="checkbox" checked>研发</span></label><button>创建</button></form><div id="users"></div></section></div></main><footer>登录、提交、审批与下载均由服务端审计。</footer><script src="/app.js"></script></body></html>
